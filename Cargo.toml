[package]
name = "pcw-backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
log = "0.4.28"
nix = { version = "0.30.1", features = ["signal"] }
once_cell = "1.21.3"
prost = "0.14.1"
serde = { version = "1.0.219", features = ["derive"] }
simple_logger = "5.1.0"
tokio = { version = "1.48.0", features = ["full"] }
tokio-stream = "0.1.17"
toml = "0.9.5"
tonic = "0.14.2"
tonic-prost = "0.14.2"

[build-dependencies]
tonic-prost-build = "0.14.2"
